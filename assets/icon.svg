<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- rounded triangle via thick stroke with round joins -->
    <mask id="tri">
      <rect width="512" height="512" fill="black"/>
      <polygon points="256,62 462,430 50,430" fill="white" stroke="white" stroke-width="56" stroke-linejoin="round"/>
    </mask>
    <mask id="pinhole">
      <rect width="512" height="512" fill="white"/>
      <circle cx="256" cy="318" r="17" fill="black"/>
    </mask>
  </defs>
  <!-- three severity bands: yellow / orange / red -->
  <g mask="url(#tri)">
    <rect x="0" y="0" width="512" height="205" fill="#FFC21A"/>
    <rect x="0" y="205" width="512" height="125" fill="#F5841F"/>
    <rect x="0" y="330" width="512" height="182" fill="#DD3B2C"/>
  </g>
  <!-- cloud -->
  <g fill="#FFFFFF">
    <circle cx="210" cy="300" r="48"/>
    <circle cx="272" cy="262" r="62"/>
    <circle cx="328" cy="306" r="42"/>
    <rect x="162" y="298" width="208" height="50" rx="25"/>
    <rect x="200" y="290" width="130" height="58"/>
  </g>
  <!-- location pin -->
  <path mask="url(#pinhole)" fill="#1F2A36"
        d="M256 270 c-27 0 -48 21 -48 48 c0 34 48 84 48 84 s48 -50 48 -84 c0 -27 -21 -48 -48 -48 z"/>
</svg>
